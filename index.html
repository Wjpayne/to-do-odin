<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>to-do-odin</title>
    <script type="module" crossorigin src="/to-do-odin/assets/index-DGhPPL2J.js"></script>
    <link rel="stylesheet" crossorigin href="/to-do-odin/assets/index-wks1_A4q.css">
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h2>Projects</h2>
        <ul id="project-list"></ul>
        <input id="project-input" placeholder="New project" />
        <button id="add-project">Add Project</button>
      </aside>

      <main>
        <h2 id="current-project"></h2>

        <div id="todo-form">
          <input id="todo-title" placeholder="Todo title" required />
          <input id="todo-date" type="date" min="" required />
          <select id="todo-priority" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <button id="add-todo" type="submit">Add Todo</button>
        </div>

        <ul id="todo-list"></ul>
      </main>
    </div>
  </body>
</html>
