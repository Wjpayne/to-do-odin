<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do-odin</title>
    <script type="module" crossorigin src="/to-do-odin/assets/index-BocrStmI.js"></script>
    <link rel="stylesheet" crossorigin href="/to-do-odin/assets/index-Ccd48wZP.css">
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h2>Projects</h2>
        <ul id="project-list"></ul>
        <input id="project-input" placeholder="New project" />
        <button id="add-project">Add Project</button>
      </aside>

      <main>
        <h2 id="current-project"></h2>

        <div id="todo-form">
          <input id="todo-title" placeholder="Todo title" required/>
          <input id="todo-date" type="date" min="" required />
          <select id="todo-priority" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <button id="add-todo" type = "submit">Add Todo</button>
        </div>

        <ul id="todo-list"></ul>
      </main>

      
    </div>
  </body>
</html>
